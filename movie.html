<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticketing System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .ticket-system {
            background-color: #f4f4f4;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-top: 0; color: #333; }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Fixes padding inside width */
            font-size: 1rem;
        }

        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover { background-color: #c40812; }

        /* The Ticket Design */
        #ticketContainer {
            display: none;
            background: white;
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            border: 2px dashed #333;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            position: relative;
        }

        #ticketContainer h3 {
            color: #e50914;
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .ticket-details p {
            margin: 10px 0;
            text-align: left;
            font-size: 1.1rem;
        }

        .special-notification {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }

        .child-message {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .adult-message {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="ticket-system">
    <h2>🎬 Movie Ticketing System</h2>
    
    <div class="input-group">
        <label for="nameInput">Name:</label>
        <input type="text" id="nameInput" placeholder="Enter your name">
    </div>
    
    <div class="input-group">
        <label for="ageInput">Age:</label>
        <input type="number" id="ageInput" placeholder="Enter your age">
    </div>
    
    <button onclick="issueTicket()">🎟️ Get Ticket</button>

    <!-- The printed ticket will appear here -->
    <div id="ticketContainer">
        <h3>🎟️ Your Movie Ticket</h3>
        <div class="ticket-details">
            <!-- Details will be injected by JavaScript -->
        </div>
    </div>
</div>

<script>
    function issueTicket() {
        // 1. Get user inputs
        const name = document.getElementById('nameInput').value;
        const ageInput = document.getElementById('ageInput').value;
        const age = parseInt(ageInput);

        // 2. Simple validation
        if (!name || isNaN(age)) {
            alert("Please enter both your name and a valid age.");
            return;
        }

        // 3. Determine the message based on age
        let specialMessage = "";
        let messageClass = "";

        if (age < 18) {
            // Notification for children
            specialMessage = "🍿 FREE POPCORN! Enjoy the show!";
            messageClass = "child-message";
        } else {
            // Reminder for adults
            specialMessage = "👨‍👩‍👧 REMINDER: Please supervise children in your group.";
            messageClass = "adult-message";
        }

        // 4. Display the ticket
        const ticketContainer = document.getElementById('ticketContainer');
        const detailsDiv = ticketContainer.querySelector('.ticket-details');

        ticketContainer.style.display = "block";
        detailsDiv.innerHTML = `
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Age:</strong> ${age}</p>
            <div class="special-notification ${messageClass}">
                ${specialMessage}
            </div>
        `;
    }
</script>

</body>
</html>
