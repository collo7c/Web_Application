<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Registration</title>
    <link rel="stylesheet" href="csslab.css">
</head>
<body>

<h1>📝 Member Registration Form</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="membership.html">Membership Plans</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact Us</a>
    <a href="class.html">Classes</a>
    <a href="gallery.html">Gallery</a>
</nav>

<form>
    <label>Full Name:</label>
    <input type="text" placeholder="Enter your full name" required>

    <label>Email Address:</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Phone Number:</label>
    <input type="tel" placeholder="Enter your phone number" required>

    <label>Age:</label>
    <input type="number" placeholder="Enter your age" min="10" max="100">

    <label>Gender:</label>
    <input type="radio" name="gender" id="male"> <label for="male" style="display:inline;">Male</label>
    <input type="radio" name="gender" id="female"> <label for="female" style="display:inline;">Female</label>

    <label>Select Membership Plan:</label>
    <select>
        <option>Basic - Ksh 2,000</option>
        <option>Standard - Ksh 5,500</option>
        <option>Premium - Ksh 18,000</option>
    </select>

    <label>Fitness Goals:</label>
    <input type="checkbox" id="weight"> <label for="weight" style="display:inline;">Weight Loss</label>
    <input type="checkbox" id="muscle"> <label for="muscle" style="display:inline;">Muscle Gain</label>
    <input type="checkbox" id="fitness"> <label for="fitness" style="display:inline;">Improve Fitness</label>

    <label>Additional Comments:</label>
    <textarea rows="5" placeholder="Any special requests or comments..."></textarea>

    <input type="submit" value="Register Now">
</form>

<footer>
    <p>&copy; 2026 FitZone Gym. All Rights Reserved.</p>
</footer>

</body>
</html>
