<!DOCTYPE html>
<html>
<head>
    <title>FitZone Gym - Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>📝 Member Registration Form</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="membership.html">Membership Plans</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact Us</a>
    <a href="class.html">Classes</a>
    <a href="gallery.html">Gallery</a>
</nav>

<form id="registrationForm" action="process_registration.php" method="POST">
    <label>Full Name:</label>
    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

    <label>Email Address:</label>
    <input type="email" id="emailAddr" name="email" placeholder="Enter your email" required>

    <label>Phone Number:</label>
    <input type="tel" id="phoneNum" name="phone" placeholder="Enter your phone number" required>

    <label>Age:</label>
    <input type="number" id="age" name="age" placeholder="Enter your age" min="10" max="100">

    <label>Gender:</label>
    <input type="radio" name="gender" id="male" value="Male"> <label for="male" style="display:inline;">Male</label>
    <input type="radio" name="gender" id="female" value="Female"> <label for="female" style="display:inline;">Female</label>

    <label>Select Membership Plan:</label>
    <select id="planSelect" name="plan">
        <option value="">-- Choose a plan --</option>
        <option value="Basic - Ksh 2,000">Basic - Ksh 2,000</option>
        <option value="Standard - Ksh 5,500">Standard - Ksh 5,500</option>
        <option value="Premium - Ksh 18,000">Premium - Ksh 18,000</option>
    </select>

    <label>Fitness Goals:</label>
    <input type="checkbox" id="weight" name="goals[]" value="Weight Loss"> <label for="weight" style="display:inline;">Weight Loss</label>
    <input type="checkbox" id="muscle" name="goals[]" value="Muscle Gain"> <label for="muscle" style="display:inline;">Muscle Gain</label>
    <input type="checkbox" id="fitness" name="goals[]" value="Improve Fitness"> <label for="fitness" style="display:inline;">Improve Fitness</label>

    <label>Additional Comments:</label>
    <textarea rows="5" id="comments" name="comments" placeholder="Any special requests or comments..."></textarea>

    <div id="formError"></div>
    <div id="confirmationToast"></div>

    <input type="submit" value="Register Now">
</form>

<footer>
    <p>&copy; 2026 FitZone Gym. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
